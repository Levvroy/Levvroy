<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Jonathan Lewie, Informatics at ITB" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080e"/>
      <stop offset="1" stop-color="#0a1520"/>
    </linearGradient>

    <!-- nama: gradient yang bergeser pelan (shimmer) -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8f4fa"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#8fd3ec"/>
      <stop offset="0.65" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f4fa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0; 600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FB3D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5FB3D4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#fadeX)"/></mask>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5FB3D4" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="340">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>

    <style>
      .sans { font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

      .blob1 { animation: drift1 14s ease-in-out infinite alternate; }
      .blob2 { animation: drift2 18s ease-in-out infinite alternate; }
      .blob3 { animation: drift3 16s ease-in-out infinite alternate; }
      @keyframes drift1 { from { transform: translate(0,0) } to { transform: translate(120px,40px) } }
      @keyframes drift2 { from { transform: translate(0,0) } to { transform: translate(-140px,-30px) } }
      @keyframes drift3 { from { transform: translate(0,0) } to { transform: translate(60px,-50px) } }

      .gridmove { animation: grid 8s linear infinite; }
      @keyframes grid { from { transform: translate(0,0) } to { transform: translate(-40px,-40px) } }

      .pulse { stroke-dasharray: 50 450; animation: run 5s linear infinite; }
      .p2 { animation-delay: -1.7s; animation-duration: 6s; }
      .p3 { animation-delay: -3.1s; animation-duration: 4.5s; }
      .p4 { animation-delay: -0.8s; animation-duration: 7s; }
      @keyframes run { from { stroke-dashoffset: 500 } to { stroke-dashoffset: 0 } }

      .via { animation: blink 2.4s ease-in-out infinite; }
      .v2 { animation-delay: .6s } .v3 { animation-delay: 1.2s } .v4 { animation-delay: 1.8s }
      @keyframes blink { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

      .in1, .in2, .in3, .in4 { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
      .in1 { animation-delay: .1s } .in2 { animation-delay: .35s } .in3 { animation-delay: .6s } .in4 { animation-delay: .85s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }

      .dot { animation: ping 1.8s ease-out infinite; transform-origin: 116px 273px; transform-box: view-box; }
      @keyframes ping { 0% { opacity: .9; transform: scale(1) } 100% { opacity: 0; transform: scale(2.6) } }

      .sweep { stroke-dasharray: 380 2700; animation: sweep 7s linear infinite; }
      @keyframes sweep { from { stroke-dashoffset: 3080 } to { stroke-dashoffset: 0 } }

      .cursor { animation: caret 1s steps(1) infinite; }
      @keyframes caret { 50% { opacity: 0 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>

    <!-- aurora -->
    <g filter="url(#blur)" opacity="0.75">
      <circle class="blob1" cx="820" cy="80" r="150" fill="#2c7fa3"/>
      <circle class="blob2" cx="1080" cy="260" r="140" fill="#6d5bd0"/>
      <circle class="blob3" cx="640" cy="330" r="120" fill="#1d5a6e"/>
    </g>

    <!-- grid bergerak, memudar ke kiri supaya teks tetap bersih -->
    <g mask="url(#gridMask)">
      <rect class="gridmove" x="0" y="0" width="1280" height="420" fill="url(#grid)"/>
    </g>

    <!-- jalur sirkuit ala PCB: masuk dari tepi kanan ke chip, keluar ke kiri -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#5FB3D4" stroke-opacity="0.25" stroke-width="2">
        <path d="M1200 96 H1110 L1062 148 H1042"/>
        <path d="M1200 246 H1112 L1068 190 H1042"/>
        <path d="M1006 128 V78 L1050 34 H1200"/>
        <path d="M958 162 H904 L864 122 H770"/>
        <path d="M958 176 H918 L878 216 H806"/>
        <path d="M992 212 V262 L966 288 H880"/>
      </g>
      <g stroke="#a8e8ff" stroke-width="2.5" filter="url(#glow)">
        <path class="pulse"    d="M1200 96 H1110 L1062 148 H1042"/>
        <path class="pulse p2" d="M1200 246 H1112 L1068 190 H1042"/>
        <path class="pulse p3" d="M1200 34 H1050 L1006 78 V128"/>
        <path class="pulse p4" d="M958 162 H904 L864 122 H770"/>
        <path class="pulse p2" d="M958 176 H918 L878 216 H806"/>
        <path class="pulse p3" d="M992 212 V262 L966 288 H880"/>
      </g>
    </g>
    <g fill="#0a1520" stroke="#5FB3D4" stroke-width="2">
      <circle class="via"    cx="770" cy="122" r="5"/>
      <circle class="via v2" cx="806" cy="216" r="5"/>
      <circle class="via v3" cx="880" cy="288" r="5"/>
    </g>

    <!-- chip -->
    <g transform="translate(1000 170)">
      <rect x="-34" y="-34" width="68" height="68" rx="8" fill="#0b1824" stroke="#5FB3D4" stroke-opacity="0.6" stroke-width="1.5"/>
      <rect x="-20" y="-20" width="40" height="40" rx="4" fill="none" stroke="#5FB3D4" stroke-opacity="0.35"/>
      <g stroke="#5FB3D4" stroke-opacity="0.5" stroke-width="2">
        <path d="M-22 -34 v-8 M-8 -34 v-8 M6 -34 v-8 M20 -34 v-8"/>
        <path d="M-22 34 v8 M-8 34 v8 M6 34 v8 M20 34 v8"/>
        <path d="M-34 -22 h-8 M-34 -8 h-8 M-34 6 h-8 M-34 20 h-8"/>
        <path d="M34 -22 h8 M34 -8 h8 M34 6 h8 M34 20 h8"/>
      </g>
      <text class="mono" x="0" y="4" text-anchor="middle" font-size="11" fill="#8fd3ec" letter-spacing="1">ESP32</text>
    </g>

    <!-- teks -->
    <g class="in1">
      <text class="mono" x="96" y="108" font-size="15" fill="#5FB3D4" letter-spacing="3">// INFORMATICS @ ITB</text>
    </g>
    <g class="in2">
      <text class="sans" x="92" y="182" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#nameGrad)">Jonathan Lewie</text>
    </g>
    <g class="in3">
      <text class="sans" x="96" y="222" font-size="20" fill="#9fb3c2">Firmware, sistem, dan tools kecil yang saya pakai sendiri.<tspan class="cursor" fill="#5FB3D4"> ▍</tspan></text>
    </g>
    <g class="in4">
      <rect x="92" y="254" width="206" height="38" rx="19" fill="#5FB3D4" fill-opacity="0.08" stroke="#5FB3D4" stroke-opacity="0.35"/>
      <circle class="dot" cx="116" cy="273" r="5" fill="#4ade80"/>
      <circle cx="116" cy="273" r="5" fill="#4ade80"/>
      <text class="mono" x="132" y="278" font-size="14" fill="#cfe6f0">levvtzy.xyz</text>
    </g>
  </g>

  <!-- border + cahaya yang mengelilingi kartu -->
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#5FB3D4" stroke-opacity="0.18" stroke-width="1.5"/>
  <rect class="sweep" x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="url(#border)" stroke-width="2"/>
</svg>
