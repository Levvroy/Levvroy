<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="40" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5FB3D4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5FB3D4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5FB3D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="120">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .pulseL { stroke-dasharray: 70 700; animation: runL 4.5s linear infinite; }
      .pulseR { stroke-dasharray: 70 700; animation: runR 4.5s linear infinite; }
      @keyframes runL { from { stroke-dashoffset: 0 } to { stroke-dashoffset: 770 } }
      @keyframes runR { from { stroke-dashoffset: 0 } to { stroke-dashoffset: 770 } }
      .core { animation: breathe 3s ease-in-out infinite; transform-origin: 600px 50px; transform-box: view-box; }
      @keyframes breathe { 0%,100% { opacity: .55; transform: scale(1) } 50% { opacity: 1; transform: scale(1.15) } }
    </style>
  </defs>

  <!-- dua jalur dari tepi menuju titik tengah -->
  <path d="M40 50 H560" stroke="url(#line)" stroke-width="1.5" fill="none"/>
  <path d="M640 50 H1160" stroke="url(#line)" stroke-width="1.5" fill="none"/>
  <g filter="url(#glow)" stroke="#9fe3ff" stroke-width="2" stroke-linecap="round" fill="none">
    <path class="pulseL" d="M-150 50 H560"/>
    <path class="pulseR" d="M1350 50 H640"/>
  </g>

  <g transform="translate(600 50) rotate(45)">
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#0a1520" stroke="#5FB3D4" stroke-width="1.5"/>
  </g>
  <circle class="core" cx="600" cy="50" r="4" fill="#9fe3ff"/>

  <text class="mono" x="600" y="98" text-anchor="middle" font-size="13" fill="#6f8796" letter-spacing="3">THANKS FOR DROPPING BY</text>
</svg>
