name: Update profile widgets

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 01:00 WIB, sekali sehari
  workflow_dispatch: # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]
    paths: [".github/workflows/profile-widgets.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Snake yang memakan contribution graph
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=2c5364
            profile/snake-dark.svg?palette=github-dark&color_snake=5FB3D4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Contribution calendar versi 3D
      - name: Generate 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. Streak card
      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&background=0d1117&ring=5FB3D4&fire=5FB3D4&currStreakLabel=5FB3D4&timezone=Asia/Jakarta&locale=id
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Stats card (rank_icon=github supaya tidak menampilkan huruf rank)
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&hide_border=true&bg_color=0d1117&title_color=5FB3D4&icon_color=5FB3D4&text_color=c9d1d9&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 5. Top languages card
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&bg_color=0d1117&title_color=5FB3D4&text_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile profile-3d-contrib
          git commit -m "chore: update profile widgets" || exit 0
          git push
