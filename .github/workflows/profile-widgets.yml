name: Update profile widgets

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 01:00 WIB, sekali sehari
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-widgets.yml"
      - "profile.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 0. Aset desain (header, section, kartu proyek, toolkit, footer) dari profile.json
      - name: Build design assets
        run: python3 scripts/build_assets.py

      # 1. Snake, warna disamakan dengan tema PCB
      - name: Generate snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#c9a14a&color_dots=#1a3a2c,#1f5a3f,#2d7a52,#46a06b,#7cc48f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Contribution calendar 3D
      - name: Generate 3D contributions
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. Streak card
      - name: Generate streak card
        continue-on-error: true
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&border_radius=12&background=0d2a1f&stroke=1f4d38&ring=c9a14a&fire=c9a14a&currStreakNum=ece8dc&sideNums=ece8dc&currStreakLabel=c9a14a&sideLabels=9fb3a6&dates=9fb3a6&timezone=Asia/Jakarta&locale=id&card_height=195
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Stats card
      - name: Generate stats card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&hide_border=true&border_radius=12&bg_color=0d2a1f&title_color=ece8dc&icon_color=c9a14a&text_color=9fb3a6&ring_color=c9a14a&include_all_commits=true&card_width=495
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in assets profile profile-3d-contrib; do
            [ -d "$d" ] && git add -A "$d"
          done
          git commit -m "chore: update profile widgets" || exit 0
          git pull --rebase -X theirs origin main
          git push
